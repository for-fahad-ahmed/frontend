<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <aside class="left-sidebar">

            <div class="icon">
                <img src="media/view-dashboard.svg" width="50" height="50" alt="Dashboard Icon">
                <span>Dashboard</span>
            </div>
            
            <ul class="tabs">
                <li class="tab">
                    <img src="media/home.png" alt="Home Icon">
                    <span>Home</span>
                </li>

                <li class="tab">
                    <img src="media/user.png" width="25" height="25"  alt="User Profile Icon">
                    <span>Profile</span>
                </li>

                <li class="tab">
                    <img src="media/chatting.png" width="25" height="25"  alt="Messages Icon">
                    <span>Messages</span>
                </li>

                <li class="tab">
                    <img src="media/recent.png" width="25" height="25"  alt="History Icon">
                    <span>History</span>
                </li>

                <li class="tab">
                    <img src="media/task.png" width="25" height="25"  alt="Tasks Icon">
                    <span>Tasks</span>
                </li>

                <li class="tab">
                    <img src="media/group-users.png" width="25" height="25"  alt="Communities Icon">
                    <span>Communities</span>
                </li>

                <li class="tab">
                    <img src="media/settings.png" width="25" height="25"  alt="Settings Icon">
                    <span>Settings</span>
                </li>

                <li class="tab">
                    <img src="media/customer-support.png" width="25" height="25"  alt="Customer Support Icon">
                    <span>Support</span>
                </li>

                <li class="tab">
                    <img src="media/insurance.png" width="25" height="25"  alt="Privacy Policy Icon">
                    <span>Privacy</span>
                </li>
            </ul>

        </aside>

        <header class="top-section">

            <div class="search">
                <img src="media/search.png" width="15" height="15" alt="Search Icon">
                <input type="search" name="search" id="search" placeholder="Search">
            </div>

            <div class="profile">
                <img src="media/notification.png" id="notification" width="15" height="15" alt="Notifications Icon">
                <img src="media/img1.png" id="profile-icon" class="round" width="40" height="40" alt="User Profile Thumbnail">
                <h3>Fahad Ahmed</h3>
            </div>

            <div class="hi-there">
                <img src="media/img1.png" class="round" width="80" height="80" alt="User Profile Picture">
                <p class="greeting">Hi there,</p>
                <p class="username">Fahad Ahmed (@fahad)</p>
            </div>

            <div class="buttons">
                <button type="button" class="btn">New</button>
                <button type="button" class="btn">Upload</button>
                <button type="button" class="btn">Share</button>
            </div>
        </header>

        <main>
            <section class="your-projects"></section>
            <section class="announcements"></section>
            <section class="trending"></section>
        </main>

    </div>

</body>
</html>
