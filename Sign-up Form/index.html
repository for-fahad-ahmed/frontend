<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="left-sidebar">
            <div class="overlay">
                <img src="media/odin-logo.png">
                <h1>FAHAD</h1>
            </div>
        </div>

        <div class="main">
            <div class="top-text">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started</p>
                <p>You know <em>you</em> want to!</p>
            </div>

            <form class="form" action="#" name="login" method="post">

                <div class="form-field">
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" id="first_name" name="first_name" maxlength="20" required>
                </div>

                <div class="form-field">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" id="last_name" name="last_name" maxlength="20" required>
                </div>

                <div class="form-field">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" placeholder="abc@email.com" required>
                </div>

                <div class="form-field">
                    <label for="phone_num">PHONE NUMBER</label>
                    <input type="tel" id="phone_num" name="phone_num" pattern="(?:\+92|0)?3[0-9]{2}-?[0-9]{7}" placeholder="03xxxxxxxxx"
                        title="Please enter a valid phone number." required>
                </div>

                <div class="form-field">
                    <label for="pwd">PASSWORD</label>
                    <input type="password" id="pwd" name="password" required>
                </div>

                <div class="form-field">
                    <label for="confirm_pwd">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm_pwd" name="confirm_pwd" required>
                </div>


                <button type="submit">Create Account</button>
            </form>
            <p>Already have an account <a href="#">Log in</a></p>
        </div>

    </div>
</body>

</html>
