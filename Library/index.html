<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>My Library</h1>
        <button id="new-book-btn" class="primary-btn">New Book</button>
    </header>

    <main class="main-content">

        <div id="library-container" class="library-grid">
        </div>
    </main>

    <dialog id="book-dialog" class="modal">
        <form id="book-form" class="book-form">
            <h2>Add New Book</h2>
            
            <div class="form-control">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-control">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="form-control">
                <label for="pages">Number of Pages</label>
                <input type="number" id="pages" name="pages" min="1" required>
            </div>

            <div class="form-control checkbox-control">
                <input type="checkbox" id="isRead" name="isRead">
                <label for="isRead">I have read this book</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="submit-btn">Add to Library</button>
                <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
            </div>
        </form>
    </dialog>
</body>
</html>
